name: keep-alive

on:
  schedule:
    - cron: "30 2 * * *" # ทุกวัน 09:30 น. เวลาไทย (+7)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Render + keep Supabase active
        run: |
          curl -fsS -o /dev/null --max-time 120 "https://nail-salonyala.onrender.com/api/services" || true
          curl -fsS -o /dev/null --max-time 30 "https://api.supabase.com" || true